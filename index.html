<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rutina</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Rutina&quot;,&quot;short_name&quot;:&quot;Rutina&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;fullscreen&quot;,&quot;background_color&quot;:&quot;%23000000&quot;,&quot;theme_color&quot;:&quot;%23000000&quot;,&quot;orientation&quot;:&quot;landscape&quot;}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { height:100%; background:#000; color:#fff; font-family: 'Segoe UI', Arial, sans-serif; overflow:hidden; }
  #app { height:100vh; width:100vw; display:flex; flex-direction:column; }

  .screen { flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:20px; }
  .screen.active { display:flex; }

  .bigBtn {
    background:#111; color:#0f0; border:4px solid #0f0; border-radius:20px;
    font-size: clamp(20px, 4vw, 48px); padding:2vh 4vw; margin:1.5vh 0; width:80%; max-width:600px;
    cursor:pointer;
  }
  .bigBtn:active { background:#0f0; color:#000; }

  #exerciseIcon { font-size: clamp(40px, 10vw, 110px); margin-bottom: 1vh; }
  #exerciseName { font-size: clamp(24px, 6vw, 60px); text-align:center; text-transform:uppercase; letter-spacing:2px; margin-bottom:2vh; color:#0ff; }
  #targetLabel { font-size: clamp(14px, 3vw, 28px); color:#888; margin-bottom:1vh; }
  #bigNumber { font-size: clamp(80px, 22vw, 260px); font-weight:bold; line-height:1; cursor:pointer; }
  #bigNumber.time { color:#0ff; }
  #bigNumber.reps { color:#ff0; border-bottom: 4px dashed #ff0; padding: 0 20px; }

  #nextBtn {
    background:#0a0; color:#000; font-size: clamp(18px, 5vw, 40px); font-weight:bold;
    border:none; border-radius:20px; padding:3vh 8vw; margin-top:3vh; width:90%; max-width:700px;
  }
  #nextBtn:active { background:#0f5; }

  #progressBar { position:fixed; top:0; left:0; height:8px; background:#0f0; width:0%; transition: width 0.3s linear; z-index:5; }
  #stepCounter { position:fixed; top:15px; right:20px; font-size: clamp(12px,2.5vw,22px); color:#666; }

  #chartScreen { flex-direction:column; padding:20px; justify-content:flex-start; }
  #chartContainer { position:relative; width:100%; max-width:1000px; height:60vh; margin: 0 auto; }
  #chartCanvas { width:100% !important; height:100% !important; }

  #exerciseNote { font-size: clamp(12px, 2.2vw, 20px); color:#f80; text-align:center; margin-top:1vh; max-width:80%; }

  .backBtn { position:fixed; top:15px; left:20px; font-size: clamp(12px,2.5vw,20px); color:#0ff; background:none; border:2px solid #0ff; border-radius:10px; padding:5px 15px; z-index:5; }

  /* Numpad overlay */
  #numpadOverlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none;
    flex-direction:column; align-items:center; justify-content:center; z-index:20;
  }
  #numpadOverlay.active { display:flex; }
  #numpadDisplay { font-size: clamp(60px,15vw,150px); color:#ff0; margin-bottom:3vh; min-width:200px; text-align:center; }
  #numpadGrid { display:grid; grid-template-columns: repeat(3, 1fr); gap:2vh 2vw; }
  .numKey {
    background:#222; color:#fff; border:3px solid #555; border-radius:15px;
    font-size: clamp(24px,5vw,48px); width: clamp(70px,12vw,120px); height: clamp(60px,10vw,100px);
  }
  .numKey:active { background:#555; }
  #numpadDone {
    margin-top:3vh; background:#0a0; color:#000; font-size: clamp(20px,4vw,36px); font-weight:bold;
    border:none; border-radius:15px; padding:2vh 8vw;
  }
</style>
</head>
<body>
<div id="app">

  <div id="progressBar"></div>
  <div id="stepCounter"></div>

  <div class="screen active" id="menuScreen">
    <h1 style="font-size: clamp(30px,6vw,60px); color:#0f0; margin-bottom:5vh;">RUTINA</h1>
    <button class="bigBtn" onclick="startWorkout()">▶ EMPEZAR RUTINA</button>
    <button class="bigBtn" onclick="showProgress()">📈 VER PROGRESO</button>
  </div>

  <div class="screen" id="workoutScreen">
    <div id="exerciseIcon"></div>
    <div id="exerciseName"></div>
    <div id="targetLabel"></div>
    <div id="bigNumber">0</div>
    <div id="exerciseNote"></div>
    <button id="nextBtn" onclick="nextStep()">SIGUIENTE ➜</button>
  </div>

  <div class="screen" id="doneScreen">
    <h1 style="font-size: clamp(30px,7vw,70px); color:#0f0;">🎉 RUTINA COMPLETA</h1>
    <button class="bigBtn" onclick="goMenu()" style="margin-top:5vh;">MENÚ</button>
  </div>

  <div class="screen" id="chartScreen">
    <button class="backBtn" onclick="goMenu()">← Menú</button>
    <h2 style="font-size: clamp(20px,4vw,36px); margin-bottom:2vh; color:#0ff;">PROGRESO</h2>
    <div id="chartContainer"><canvas id="chartCanvas"></canvas></div>
  </div>

  <div id="numpadOverlay">
    <div id="numpadDisplay">0</div>
    <div id="numpadGrid">
      <button class="numKey" onclick="numTap('1')">1</button>
      <button class="numKey" onclick="numTap('2')">2</button>
      <button class="numKey" onclick="numTap('3')">3</button>
      <button class="numKey" onclick="numTap('4')">4</button>
      <button class="numKey" onclick="numTap('5')">5</button>
      <button class="numKey" onclick="numTap('6')">6</button>
      <button class="numKey" onclick="numTap('7')">7</button>
      <button class="numKey" onclick="numTap('8')">8</button>
      <button class="numKey" onclick="numTap('9')">9</button>
      <button class="numKey" onclick="numTap('back')">⌫</button>
      <button class="numKey" onclick="numTap('0')">0</button>
      <button class="numKey" onclick="numTap('clear')">C</button>
    </div>
    <button id="numpadDone" onclick="closeNumpad()">LISTO</button>
  </div>

</div>

<script>
/* ================= RUTINA ================= */
const ICONS = {
  'Caminata':'🚶', 'Caminar':'🚶',
  'Flexiones al fallo':'💪',
  'Sentadillas':'🦵',
  'Plancha':'🧘',
  'Zancadas':'🏃',
  'Mountain Climbers':'⛰️',
  'Descansa Caminando':'🚶',
  'Burpees':'🔥',
  'Bear Crawl':'🐻',
  'Silla Invisible':'🪑'
};

const CHART_COLORS = {
  'Flexiones al fallo':'#0f0',
  'Sentadillas':'#0ff',
  'Zancadas':'#f0f',
  'Burpees':'#ff0',
  'Bear Crawl':'#f80'
};

const routine = [
  {type:'time', name:'Caminata', duration:300},
  {type:'reps', name:'Flexiones al fallo'},
  {type:'reps', name:'Sentadillas', target:15},
  {type:'time', name:'Caminar', duration:30},
  {type:'reps', name:'Flexiones al fallo'},
  {type:'time', name:'Plancha', duration:20},
  {type:'reps', name:'Zancadas', target:'10 por pierna'},
  {type:'time', name:'Mountain Climbers', duration:30},
  {type:'time', name:'Descansa Caminando', duration:60},
  {type:'reps', name:'Burpees', target:5, note:'Si no puedes con esto, hazlo con 5 saltos mariposa'},
  {type:'reps', name:'Bear Crawl', target:'10 pasos adelante, 10 atrás'},
  {type:'time', name:'Silla Invisible', duration:45},
  {type:'time', name:'Caminar', duration:180},
];

let stepIndex = 0;
let timerInterval = null;
let currentReps = 0;
let wakeLock = null;
let audioCtx = null;

const el = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  el(id).classList.add('active');
}

async function requestWakeLock(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }
  catch(e){ console.log('WakeLock error', e); }
}
document.addEventListener('visibilitychange', async ()=>{
  if(wakeLock !== null && document.visibilityState === 'visible'){ await requestWakeLock(); }
});

function beep(times=3){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  let t = audioCtx.currentTime;
  for(let i=0;i<times;i++){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = 130; // tono grave, audible sin mirar la pantalla
    gain.gain.setValueAtTime(0.5, t + i*0.4);
    osc.start(t + i*0.4);
    osc.stop(t + i*0.4 + 0.3);
  }
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
}

function saveLog(exercise, reps){
  const logs = JSON.parse(localStorage.getItem('workoutLogs')||'[]');
  logs.push({date: new Date().toISOString().slice(0,10), exercise, reps});
  localStorage.setItem('workoutLogs', JSON.stringify(logs));
}

function startWorkout(){
  requestWakeLock();
  stepIndex = 0;
  showScreen('workoutScreen');
  runStep();
}

function updateProgressBar(){
  el('progressBar').style.width = ((stepIndex)/routine.length*100)+'%';
  el('stepCounter').textContent = (stepIndex+1)+' / '+routine.length;
}

function runStep(){
  if(timerInterval) clearInterval(timerInterval);
  const step = routine[stepIndex];
  updateProgressBar();
  el('exerciseIcon').textContent = ICONS[step.name] || '⚡';
  el('exerciseName').textContent = step.name;
  el('exerciseNote').textContent = step.note || '';
  const bigNum = el('bigNumber');

  if(step.type === 'time'){
    el('targetLabel').textContent = 'TIEMPO';
    bigNum.className = 'time';
    bigNum.onclick = null;
    let remaining = step.duration;
    bigNum.textContent = formatTime(remaining);
    el('nextBtn').textContent = 'SALTAR ➜';
    timerInterval = setInterval(()=>{
      remaining--;
      bigNum.textContent = formatTime(remaining);
      if(remaining <= 0){
        clearInterval(timerInterval);
        beep();
        nextStep();
      }
    }, 1000);
  } else {
    el('targetLabel').textContent = (step.target ? ('OBJETIVO: '+step.target) : 'AL FALLO') + ' — toca el número para escribirlo';
    bigNum.className = 'reps';
    currentReps = (typeof step.target === 'number') ? step.target : 0;
    bigNum.textContent = currentReps;
    bigNum.onclick = openNumpad;
    el('nextBtn').textContent = 'GUARDAR Y SIGUIENTE ➜';
  }
}

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return (m>0 ? m+':'+String(sec).padStart(2,'0') : sec);
}

/* ---- Numpad táctil ---- */
let numpadValue = '';
function openNumpad(){
  numpadValue = String(currentReps);
  el('numpadDisplay').textContent = numpadValue;
  el('numpadOverlay').classList.add('active');
}
function numTap(key){
  if(key === 'back'){ numpadValue = numpadValue.slice(0,-1); }
  else if(key === 'clear'){ numpadValue = ''; }
  else { numpadValue = (numpadValue === '0' ? '' : numpadValue) + key; }
  if(numpadValue.length > 3) numpadValue = numpadValue.slice(0,3);
  el('numpadDisplay').textContent = numpadValue === '' ? '0' : numpadValue;
}
function closeNumpad(){
  currentReps = parseInt(numpadValue || '0', 10);
  el('bigNumber').textContent = currentReps;
  el('numpadOverlay').classList.remove('active');
}

function nextStep(){
  if(timerInterval) clearInterval(timerInterval);
  const step = routine[stepIndex];
  if(step.type === 'reps'){ saveLog(step.name, currentReps); }
  stepIndex++;
  if(stepIndex >= routine.length){
    showScreen('doneScreen');
    if(wakeLock){ wakeLock.release(); wakeLock = null; }
  } else {
    runStep();
  }
}

function goMenu(){
  if(timerInterval) clearInterval(timerInterval);
  if(wakeLock){ wakeLock.release(); wakeLock = null; }
  showScreen('menuScreen');
}

/* ---- Progreso: un solo gráfico, 5 líneas de colores ---- */
let chartInstance = null;
function showProgress(){
  showScreen('chartScreen');
  renderChart();
}

function renderChart(){
  const logs = JSON.parse(localStorage.getItem('workoutLogs')||'[]');
  const exercises = Object.keys(CHART_COLORS);
  const allDates = [...new Set(logs.map(l=>l.date))].sort();

  const datasets = exercises.map(ex => {
    const points = allDates.map(date => {
      const entry = logs.find(l => l.date === date && l.exercise === ex);
      return entry ? entry.reps : null;
    });
    return {
      label: ex,
      data: points,
      borderColor: CHART_COLORS[ex],
      backgroundColor: CHART_COLORS[ex],
      spanGaps: true,
      tension: 0.2,
      pointRadius: 4
    };
  });

  const ctx = el('chartCanvas').getContext('2d');
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels: allDates, datasets },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      scales:{ y:{ beginAtZero:true, ticks:{color:'#fff'} }, x:{ ticks:{color:'#fff'} } },
      plugins:{ legend:{ labels:{color:'#fff'} } }
    }
  });
}
</script>
</body>
</html>
